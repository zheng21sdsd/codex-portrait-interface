name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/codex-portrait-interface/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Validate release tree before installing dependencies
        run: node scripts/verify-release.mjs
      - name: Install pinned Node dependency
        run: npm ci --prefix skills/codex-portrait-interface --ignore-scripts
      - name: Install pinned Python dependency
        run: python -m pip install --disable-pip-version-check -r skills/codex-portrait-interface/requirements.txt
      - name: Check JavaScript syntax
        run: npm run check:syntax --prefix skills/codex-portrait-interface
      - name: Check passive skin constraints
        run: npm run check:skin --prefix skills/codex-portrait-interface
      - name: Test image safety
        run: python tests/test_image_safety.py
